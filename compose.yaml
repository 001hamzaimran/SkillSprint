services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillsprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - skillsprint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillsprint"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  skillsprint-postgres:
